server:
  port: ${APP_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 2h
      cookie:
        name: TIZHEN_SID
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: tizhen-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:tizhen}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USER:tizhen}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: tizhen-hikari
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  session:
    timeout: 2h
    redis:
      namespace: tizhen:session
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 兼容此前由 initdb 初始化、尚无 flyway_schema_history 的本地库；
    # 空库仍会正常执行 V1。
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

tizhen:
  storage:
    # app 与 worker 必须共享同一目录；Maven 分模块启动时统一落到 backend/data/storage。
    base-dir: ${DATA_STORAGE_DIR:../data/storage}
  submission:
    rate-limit:
      max-requests: ${SUBMISSION_RATE_LIMIT_MAX:10}
      window-seconds: ${SUBMISSION_RATE_LIMIT_WINDOW_SECONDS:60}
  datagen:
    rate-limit:
      max-requests: ${DATAGEN_RATE_LIMIT_MAX:10}
      window-seconds: ${DATAGEN_RATE_LIMIT_WINDOW_SECONDS:60}
  llm:
    credential-encryption-key: ${LLM_CREDENTIAL_ENCRYPTION_KEY:}
    credential-key-version: ${LLM_CREDENTIAL_KEY_VERSION:1}
    validation-timeout-seconds: ${LLM_CREDENTIAL_VALIDATION_TIMEOUT_SECONDS:15}
    providers:
      deepseek:
        base-url: ${LLM_DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
        models: [deepseek-chat, deepseek-reasoner]
        default-model: deepseek-chat
      qwen:
        base-url: ${LLM_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        models: [qwen-plus, qwen-turbo, qwen-max]
        default-model: qwen-plus
      zhipu:
        base-url: ${LLM_ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        models: [glm-4-plus, glm-4-air, glm-4-flash]
        default-model: glm-4-plus
      openai:
        base-url: ${LLM_OPENAI_BASE_URL:https://api.openai.com/v1}
        models: [gpt-4o-mini, gpt-4o]
        default-model: gpt-4o-mini
  security:
    player:
      session:
        absolute-timeout-seconds: 43200
      csrf:
        cookie-name: XSRF-TOKEN
        header-name: X-XSRF-TOKEN
      login:
        max-failures: 5
        window-seconds: 900
        lock-seconds: 900
    admin:
      session:
        cookie-name: TIZHEN_ADMIN_SID
        cookie-secure: ${SESSION_COOKIE_SECURE:false}
        idle-timeout-seconds: 1800
        absolute-timeout-seconds: 28800
      csrf:
        cookie-name: ADMIN-XSRF-TOKEN
        header-name: X-XSRF-TOKEN
      login:
        max-failures: 5
        window-seconds: 900
        lock-seconds: 900
  bootstrap:
    admin:
      username: "${TIZHEN_BOOTSTRAP_ADMIN_USERNAME:}"
      password: "${TIZHEN_BOOTSTRAP_ADMIN_PASSWORD:}"
      display-name: "${TIZHEN_BOOTSTRAP_ADMIN_DISPLAY_NAME:超级管理员}"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.tizhen: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
