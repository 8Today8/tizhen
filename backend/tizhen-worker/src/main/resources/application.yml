spring:
  application:
    name: tizhen-worker
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:tizhen}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USER:tizhen}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: tizhen-worker-hikari
      maximum-pool-size: ${WORKER_DB_POOL_SIZE:8}
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:tizhen}
    password: ${RABBITMQ_PASSWORD:tizhen}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 关闭 Boot 默认 RabbitAdmin；由 MqConfig 在 tizhen.mq.enabled=true 时声明拓扑。
    dynamic: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

tizhen:
  storage:
    # app 与 worker 必须共享同一目录；Maven 分模块启动时统一落到 backend/data/storage。
    base-dir: ${DATA_STORAGE_DIR:../data/storage}
  judge:
    base-url: ${GO_JUDGE_URL:http://127.0.0.1:5050}
    compile-timeout-ms: ${GO_JUDGE_COMPILE_TIMEOUT_MS:20000}
    max-output-bytes: ${GO_JUDGE_MAX_OUTPUT_BYTES:16777216}
    max-attempts: ${WORKER_JUDGE_MAX_ATTEMPTS:3}
    stale-seconds: ${WORKER_JUDGE_STALE_SECONDS:300}
  mq:
    # 默认关闭，保持 V1 数据库轮询；开启后由 RabbitMQ 驱动消费。
    enabled: ${TIZHEN_MQ_ENABLED:false}
    stale-seconds: ${TIZHEN_MQ_STALE_SECONDS:30}
    scan-interval-ms: ${TIZHEN_MQ_SCAN_INTERVAL_MS:5000}
    retry-delays: ${TIZHEN_MQ_RETRY_DELAYS:5s,30s,120s}
  llm:
    base-url: ${PLATFORM_LLM_BASE_URL:}
    api-key: ${PLATFORM_LLM_API_KEY:}
    model: ${PLATFORM_LLM_MODEL:}
    timeout-seconds: ${PLATFORM_LLM_TIMEOUT_SECONDS:60}
    credential-encryption-key: ${LLM_CREDENTIAL_ENCRYPTION_KEY:}
    credential-key-version: ${LLM_CREDENTIAL_KEY_VERSION:1}
    validation-timeout-seconds: ${LLM_CREDENTIAL_VALIDATION_TIMEOUT_SECONDS:15}
    providers:
      deepseek:
        base-url: ${LLM_DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
        models: [deepseek-chat, deepseek-reasoner]
        default-model: deepseek-chat
      qwen:
        base-url: ${LLM_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        models: [qwen-plus, qwen-turbo, qwen-max]
        default-model: qwen-plus
      zhipu:
        base-url: ${LLM_ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        models: [glm-4-plus, glm-4-air, glm-4-flash]
        default-model: glm-4-plus
      openai:
        base-url: ${LLM_OPENAI_BASE_URL:https://api.openai.com/v1}
        models: [gpt-4o-mini, gpt-4o]
        default-model: gpt-4o-mini

worker:
  poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:500}
  recovery-interval-ms: ${WORKER_RECOVERY_INTERVAL_MS:30000}
  judge-concurrency: ${WORKER_JUDGE_CONCURRENCY:4}
  datagen-concurrency: ${WORKER_DATAGEN_CONCURRENCY:2}
  datagen-stale-seconds: ${WORKER_DATAGEN_STALE_SECONDS:900}
  datagen-max-attempts: ${WORKER_DATAGEN_MAX_ATTEMPTS:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      # 关闭 MQ 时不做 broker 健康检查，避免本地只启动 MySQL/Redis 时被标记 DOWN。
      enabled: ${TIZHEN_MQ_ENABLED:false}

logging:
  level:
    root: INFO
    com.tizhen: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
